<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">



    <!-- アイコンをつけるときは、<head> タグの中（<meta>タグの下など）に追加してください -->
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">



<title>月別丸印集計表</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #f3f3f3;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }

  body {
    min-height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    background: #fff;
  }

  /* 1行目：年月切替 */
  .month-bar {
    position: sticky;
    top: 0;
    z-index: 30;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-bottom: 1px solid #111;
    padding-top: env(safe-area-inset-top);
  }

  .month-title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 20px;
    font-weight: 700;
    white-space: nowrap;
  }

  .month-arrow {
    border: 0;
    background: transparent;
    color: #111;
    font-size: 25px;
    line-height: 1;
    padding: 5px 10px;
    cursor: pointer;
    touch-action: manipulation;
  }

  .month-arrow:active {
    opacity: 0.45;
  }

  .table-wrap {
    width: 100%;
    background: #fff;
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    background: #fff;
  }

  th, td {
    border-right: 1px solid #111;
    border-bottom: 1px solid #111;
    text-align: center;
    vertical-align: middle;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  th:first-child,
  td:first-child {
    border-left: 1px solid #111;
  }

  /* 2行目：項目名をスクロール時にも固定 */
  thead th {
    position: sticky;
    top: 48px;
    z-index: 20;
    height: 62px;
    background: #fafafa;
    border-top: 1px solid #111;
  }

  .date-head {
    width: 88px;
    font-size: 15px;
    line-height: 1.25;
  }

  .category-head {
    width: auto;
  }

  .category-name {
    display: block;
    font-size: 19px;
    line-height: 1.1;
    cursor: pointer;
    padding: 5px 1px 2px;
    touch-action: manipulation;
  }

  .category-count {
    display: block;
    margin-top: 3px;
    font-size: 14px;
    font-weight: 600;
  }

  .date-cell {
    width: 88px;
    height: 42px;
    font-size: 15px;
    font-weight: 600;
    background: #fafafa;
  }

  .mark-cell {
    height: 42px;
    cursor: pointer;
    font-size: 27px;
    font-weight: 500;
    line-height: 1;
    background: #fff;
    touch-action: manipulation;
  }

  .mark-cell:active {
    background: #e9e9e9;
  }

  .sunday .date-cell {
    background: #fff1f1;
  }

  .saturday .date-cell {
    background: #f0f5ff;
  }

  .footer-note {
    padding: 8px 6px 14px;
    font-size: 12px;
    color: #666;
    background: #fff;
  }

  @media (max-width: 520px) {
    .date-head,
    .date-cell {
      width: 76px;
    }

    .category-name {
      font-size: 17px;
    }

    .category-count {
      font-size: 13px;
    }

    .date-cell {
      font-size: 14px;
    }

    .mark-cell {
      font-size: 25px;
    }
  }
</style>
</head>
<body>
<div class="app">

  <div class="month-bar">
    <div class="month-title">
      <button id="prevMonth" class="month-arrow" type="button" aria-label="前の月">◀</button>
      <span id="monthLabel">2026年9月</span>
      <button id="nextMonth" class="month-arrow" type="button" aria-label="次の月">▶</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr id="headerRow">
          <th class="date-head">日付</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer-note">
    マスをタップすると○が付き、もう一度タップすると消えます。項目名をタップすると名称を変更できます。
  </div>
</div>

<script>
(() => {
  // 初期項目名
  const defaultCategories = ["頸", "腰", "足", "背", "ピ", "オ"];

  const monthLabel = document.getElementById("monthLabel");
  const prevMonthButton = document.getElementById("prevMonth");
  const nextMonthButton = document.getElementById("nextMonth");
  const headerRow = document.getElementById("headerRow");
  const tableBody = document.getElementById("tableBody");

  const weekChars = ["日", "月", "火", "水", "木", "金", "土"];

  // 現在年月を初期表示
  const now = new Date();
  let currentYear = now.getFullYear();
  let currentMonth = now.getMonth() + 1;

  // 項目名は全月共通で保存
  function loadCategories() {
    try {
      const saved = localStorage.getItem("monthly-circle-table:categories");
      if (!saved) return [...defaultCategories];

      const parsed = JSON.parse(saved);
      if (!Array.isArray(parsed) || parsed.length !== defaultCategories.length) {
        return [...defaultCategories];
      }

      return parsed;
    } catch (e) {
      return [...defaultCategories];
    }
  }

  let categories = loadCategories();

  function saveCategories() {
    localStorage.setItem(
      "monthly-circle-table:categories",
      JSON.stringify(categories)
    );
  }

  function monthValue() {
    return (
      String(currentYear).padStart(4, "0") +
      "-" +
      String(currentMonth).padStart(2, "0")
    );
  }

  function storageKey() {
    return "monthly-circle-table:" + monthValue();
  }

  function loadData() {
    try {
      const saved = localStorage.getItem(storageKey());
      return saved ? JSON.parse(saved) : {};
    } catch (e) {
      return {};
    }
  }

  function saveData(data) {
    localStorage.setItem(storageKey(), JSON.stringify(data));
  }

  function daysInMonth(year, month) {
    return new Date(year, month, 0).getDate();
  }

  function updateMonthLabel() {
    monthLabel.textContent = currentYear + "年" + currentMonth + "月";
  }

  function updateCounts(data) {
    categories.forEach((category, categoryIndex) => {
      let count = 0;

      Object.keys(data).forEach(day => {
        if (data[day] && data[day][categoryIndex]) {
          count++;
        }
      });

      const countElement = document.getElementById("count-" + categoryIndex);

      if (countElement) {
        countElement.textContent = "(" + count + ")";
      }
    });
  }

  function editCategory(index) {
    const oldName = categories[index];

    const newName = prompt(
      "項目名を変更してください",
      oldName
    );

    // キャンセル時は変更しない
    if (newName === null) return;

    const trimmed = newName.trim();

    // 空欄は受け付けない
    if (!trimmed) {
      alert("項目名を入力してください。");
      return;
    }

    categories[index] = trimmed;
    saveCategories();
    createHeader();
    updateCounts(loadData());
  }

  function createHeader() {
    while (headerRow.children.length > 1) {
      headerRow.removeChild(headerRow.lastChild);
    }

    categories.forEach((category, index) => {
      const th = document.createElement("th");
      th.className = "category-head";

      const name = document.createElement("span");
      name.className = "category-name";
      name.textContent = category;
      name.title = "タップして名称変更";

      name.addEventListener("click", () => {
        editCategory(index);
      });

      const count = document.createElement("span");
      count.className = "category-count";
      count.id = "count-" + index;
      count.textContent = "(0)";

      th.appendChild(name);
      th.appendChild(count);
      headerRow.appendChild(th);
    });
  }

  function renderTable() {
    updateMonthLabel();

    const totalDays = daysInMonth(currentYear, currentMonth);
    const data = loadData();

    tableBody.innerHTML = "";

    for (let day = 1; day <= totalDays; day++) {
      const date = new Date(currentYear, currentMonth - 1, day);
      const weekIndex = date.getDay();

      const tr = document.createElement("tr");

      if (weekIndex === 0) tr.classList.add("sunday");
      if (weekIndex === 6) tr.classList.add("saturday");

      const dateCell = document.createElement("td");
      dateCell.className = "date-cell";
      dateCell.textContent = day + "（" + weekChars[weekIndex] + "）";
      tr.appendChild(dateCell);

      categories.forEach((category, categoryIndex) => {
        const td = document.createElement("td");
        td.className = "mark-cell";

        const isMarked =
          data[String(day)] &&
          data[String(day)][categoryIndex];

        td.textContent = isMarked ? "○" : "";

        td.addEventListener("click", () => {
          const currentData = loadData();
          const dayKey = String(day);

          if (!currentData[dayKey]) {
            currentData[dayKey] = {};
          }

          currentData[dayKey][categoryIndex] =
            !currentData[dayKey][categoryIndex];

          if (!currentData[dayKey][categoryIndex]) {
            delete currentData[dayKey][categoryIndex];
          }

          if (Object.keys(currentData[dayKey]).length === 0) {
            delete currentData[dayKey];
          }

          saveData(currentData);

          td.textContent =
            currentData[dayKey] &&
            currentData[dayKey][categoryIndex]
              ? "○"
              : "";

          updateCounts(currentData);
        });

        tr.appendChild(td);
      });

      tableBody.appendChild(tr);
    }

    updateCounts(data);
  }

  function changeMonth(delta) {
    currentMonth += delta;

    if (currentMonth < 1) {
      currentMonth = 12;
      currentYear--;
    } else if (currentMonth > 12) {
      currentMonth = 1;
      currentYear++;
    }

    renderTable();

    // 月変更後は表の先頭付近へ戻す
    window.scrollTo({
      top: 0,
      behavior: "auto"
    });
  }

  prevMonthButton.addEventListener("click", () => {
    changeMonth(-1);
  });

  nextMonthButton.addEventListener("click", () => {
    changeMonth(1);
  });

  createHeader();
  renderTable();
})();
</script>
</body>
</html>
